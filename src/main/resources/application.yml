spring:
  application:
    name: industrial-agent-long
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:h2:file:./data/workorders;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# DeepSeek API (OpenAI-compatible endpoint)
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-chat
      temperature: 0.3
      max-tokens: 2048
      log-requests: true
      log-responses: true

# Milvus Vector Database (for RAG)
milvus:
  host: localhost
  port: 19530
  collection: industrial_knowledge
  dimension: 384

logging:
  level:
    dev.ai4j.openai4j: DEBUG
    com.industrial.agent: DEBUG

# TDEngine time-series database (WebSocket JDBC)
tdengine:
  jdbc-url: jdbc:TAOS-WS://localhost:6041

# MQTT broker (EMQX) for device simulator
mqtt:
  broker-url: tcp://localhost:1883
  client-id: industrial-agent-long
  topic-device-data: industrial/devices/+/data
  topic-device-alarm: industrial/devices/+/alarm

# Actuator metrics (Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# Agent hard budget
agent:
  budget:
    max-llm-calls: 5
    max-read-tools-per-request: 3
    max-write-tools-per-request: 1
    total-latency-ms: 10000

server:
  port: 8080
