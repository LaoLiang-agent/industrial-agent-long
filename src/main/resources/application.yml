spring:
  application:
    name: industrial-agent-long
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:h2:file:./data/workorders;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# Memory layer — L3/L4 PostgreSQL (dedicated datasource, separate from H2 work-order store)
agent-memory:
  datasource:
    url: ${MEMORY_DB_URL:jdbc:postgresql://localhost:5432/agent_memory}
    username: ${MEMORY_DB_USER:agent}
    password: ${MEMORY_DB_PASSWORD:agent}
    driver-class-name: org.postgresql.Driver

# DeepSeek API (OpenAI-compatible endpoint)
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-chat
      temperature: 0.3
      max-tokens: 2048
      log-requests: true
      log-responses: true

# Milvus Vector Database (for RAG)
milvus:
  host: localhost
  port: 19530
  collection: industrial_knowledge
  dimension: 384

# RAG hybrid retrieval
rag:
  rewrite-strategy: HYDE   # HYDE | MULTI_QUERY | NONE
  rerank:
    enabled: true
  dense-top-k: 10
  sparse-top-k: 10
  fusion-top-k: 5
  final-top-k: 3
  min-score: 0.3

logging:
  level:
    dev.ai4j.openai4j: DEBUG
    com.industrial.agent: DEBUG

# TDEngine time-series database (WebSocket JDBC)
tdengine:
  jdbc-url: jdbc:TAOS-WS://localhost:6041

# MQTT broker (EMQX) for device simulator
mqtt:
  broker-url: tcp://localhost:1883
  client-id: industrial-agent-long
  topic-device-data: industrial/devices/+/data
  topic-device-alarm: industrial/devices/+/alarm

# Actuator metrics (Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# Agent hard budget
agent:
  budget:
    max-llm-calls: 5
    max-read-tools-per-request: 3
    max-write-tools-per-request: 1
    total-latency-ms: 10000
  memory:
    working-ttl-seconds: 600        # L1 TTL = 10 min
    conversation-max-entries: 5     # L2 keep last 5 turns
    profile-confidence-threshold: 0.9  # L4 write gate
  prompt:
    role: "工业设备运维专家，服务于智能工厂的设备监控与故障诊断"
    policies:
      - "禁止承诺赔付金额、退款金额等财务决策"
      - "READ 类工具单轮最多调用 3 次，WRITE 类工具最多调用 1 次"
      - "不确定时必须如实说明，不得编造数据"
      - "创建工单前必须确认是硬件故障"

server:
  port: 8080
